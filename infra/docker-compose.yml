services:
  mysql:
    image: mysql:8.4
    # SPM-64: lets the services' own database user create triggers while binary
    # logging is on. venue-service uses one to refuse overlapping confirmed bookings.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: connectsphere
      MYSQL_DATABASE: user
      MYSQL_USER: connectsphere
      MYSQL_PASSWORD: connectsphere
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init/schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql

volumes:
  mysql_data:
