name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for service in user-service event-service venue-service equipment-service registration-service notification-service; do
            python -m pip install -r "services/${service}/requirements.txt"
          done

      - name: Run unit tests
        run: python scripts/run-unit-coverage.py

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py"
