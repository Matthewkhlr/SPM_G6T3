name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - event-service
          - venue-service
          - equipment-service
          - registration-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Run unittest with Coverage.py
        working-directory: services/${{ matrix.service }}
        run: |
          coverage run -m unittest discover -s tests/unit -p "test_*.py" -t .
          coverage report --fail-under=100
          coverage html
