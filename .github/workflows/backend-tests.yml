name: Backend Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  # Each service gets its own local pytest.ini (see services/*/pytest.ini) rather
  # than a shared root one, because two services' test suites both have a
  # package literally named `tests` and colliding module names crash pytest's
  # collection if they're ever run in the same process. Running each service in
  # its own job/process, scoped to its own directory, is what avoids that.
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [event-service, venue-service, equipment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest

  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            schema: user
          - service: event-service
            schema: event
          - service: venue-service
            schema: venue
          - service: equipment-service
            schema: equipment
          - service: registration-service
            schema: registration
          - service: notification-service
            schema: notification
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create schema
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS \`${{ matrix.schema }}\`;"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/${{ matrix.schema }}
        run: alembic upgrade head
