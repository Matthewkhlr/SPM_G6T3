name: Backend Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  event-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/event-service/requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest

  venue-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: services/venue-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: services/venue-service
        run: pytest

  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            schema: user
          - service: event-service
            schema: event
          - service: venue-service
            schema: venue
          - service: equipment-service
            schema: equipment
          - service: registration-service
            schema: registration
          - service: notification-service
            schema: notification
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create schema
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS \`${{ matrix.schema }}\`;"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/${{ matrix.schema }}
        run: alembic upgrade head
